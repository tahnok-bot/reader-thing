[project]
name = "reader-thing"
version = "0.1.0"
description = "A personal read-it-later service that turns URLs into EPUBs."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "trafilatura",
    "ebooklib",
    "boto3",
    "python-dotenv",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
reader-thing = "reader_thing.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reader_thing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
